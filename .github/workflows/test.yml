name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
      # `npm ci` (not `install`): the lock file pins the dev toolchain.
      - run: npm ci
      # Builds dist/ and runs the tests against it (fake execute context,
      # no n8n runtime, no network).
      - run: npm test
      # Publish guard scans the npm tarball (dist + README).
      - run: node scripts/check-publish.mjs
